<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aline Silva Hair - Agenda</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a192f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo_aline.png">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c5a059; --navy: #0a192f; --cream: #f9f7f2; --white: #ffffff;
            --whatsapp: #25d366; --danger: #ff4d4f; --success: #52c41a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--cream); color: var(--navy); padding: 10px; overflow-x: hidden; }
        .container { max-width: 400px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 15px; }
        .logo-container { width: 100px; height: 100px; margin: 0 auto 10px; border-radius: 50%; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.08); background: white; }
        .logo-container img { width: 100%; height: 100%; object-fit: cover; }
        header h1 { font-family: 'Cinzel', serif; color: var(--gold); font-size: 1.1rem; letter-spacing: 1px; }

        .card { background: var(--white); padding: 15px; border-radius: 18px; box-shadow: 0 8px 25px rgba(0,0,0,0.04); margin-bottom: 15px; border: 1px solid rgba(197, 160, 89, 0.1); }
        .input-group { margin-bottom: 8px; }
        label { display: block; font-size: 0.55rem; font-weight: 700; margin-bottom: 3px; color: var(--gold); text-transform: uppercase; }
        input { width: 100%; padding: 12px; border: 1.5px solid #f2f2f2; border-radius: 10px; font-size: 0.85rem; outline: none; background: #fafafa; color: var(--navy); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-add { width: 100%; padding: 15px; background: var(--navy); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; text-transform: uppercase; margin-top: 5px; font-size: 0.75rem; }

        .calendar-card { background: var(--white); border-radius: 18px; padding: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.04); margin-bottom: 15px; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; color: var(--gold); font-weight: 700; font-size: 0.85rem; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
        .day-name { font-size: 0.6rem; font-weight: 700; color: #ccc; text-transform: uppercase; padding-bottom: 5px; }
        .day { height: 38px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.8rem; cursor: pointer; border-radius: 8px; position: relative; font-weight: 600; }
        .day.today { color: var(--gold); border: 1px solid var(--gold); }
        .day.selected { background: var(--gold); color: white !important; }
        .day.has-app::after { content: ''; position: absolute; bottom: 4px; width: 5px; height: 5px; background: var(--gold); border-radius: 50%; }
        .day.selected.has-app::after { background: white; }

        .list-header { font-size: 0.7rem; font-weight: 700; color: var(--gold); text-transform: uppercase; margin: 10px 0; padding-left: 5px; }
        .appointment-item { background: white; padding: 12px; border-radius: 15px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; border-left: 5px solid var(--gold); box-shadow: 0 4px 15px rgba(0,0,0,0.02); transition: background 0.3s ease, border-color 0.3s ease; }
        .info .time { font-weight: 700; color: var(--gold); font-size: 0.9rem; }
        .info h4 { font-size: 0.95rem; color: var(--navy); }
        .info p { font-size: 0.7rem; color: #999; }

        .actions { display: flex; gap: 5px; }
        .btn-action { border: none; width: 34px; height: 34px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-ws { background: #e8f9ee; color: var(--whatsapp); }
        .btn-check { background: #f0f0f0; color: #ccc; }
        .btn-check.done { background: #f6ffed; color: var(--success); }
        .btn-del { background: #fff1f0; color: var(--danger); }
        .icon-svg { width: 18px; height: 18px; fill: currentColor; }

        /* Estilos das Caixas de Aviso Customizadas */
        .custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 25, 47, 0.6); z-index: 1000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(2px); }
        .custom-modal.active { display: flex; }
        .modal-content { background: var(--white); padding: 22px; border-radius: 18px; max-width: 320px; width: 100%; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.15); border: 1px solid rgba(197, 160, 89, 0.2); }
        .modal-title { font-family: 'Cinzel', serif; color: var(--gold); font-size: 1.1rem; margin-bottom: 12px; font-weight: 700; letter-spacing: 0.5px; }
        .modal-text { font-size: 0.85rem; color: var(--navy); margin-bottom: 20px; line-height: 1.5; font-weight: 400; }
        .modal-buttons { display: flex; gap: 10px; justify-content: center; }
        .modal-btn { padding: 12px 24px; border: none; border-radius: 10px; font-weight: 600; font-size: 0.75rem; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; flex: 1; }
        .modal-btn-confirm { background: var(--navy); color: white; }
        .modal-btn-cancel { background: #f5f5f5; color: #777; }
        .modal-btn-danger { background: var(--danger); color: white; }

        /* Estilos do Painel de Login */
        .login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; padding: 10px; }
        .login-card { background: var(--white); width: 100%; max-width: 350px; padding: 30px 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid rgba(197, 160, 89, 0.15); text-align: center; }
        .login-card h2 { font-family: 'Cinzel', serif; color: var(--gold); font-size: 1.3rem; margin-bottom: 25px; letter-spacing: 1px; }
        .btn-login { width: 100%; padding: 15px; background: var(--navy); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; text-transform: uppercase; margin-top: 15px; font-size: 0.8rem; letter-spacing: 0.5px; }
    </style>
</head>
<body>

<div id="loginScreen" class="login-screen">
    <div class="login-card">
        <div class="logo-container"><img src="logo_aline.jpg" alt="Aline Silva Hair"></div>
        <h2>Acesso Restrito</h2>
        <div class="input-group">
            <label>Senha de Acesso</label>
            <input type="password" id="loginPassword" placeholder="Digite a senha..." onkeypress="if(event.key === 'Enter') checkLogin()">
        </div>
        <button class="btn-login" onclick="checkLogin()">Entrar</button>
    </div>
</div>

<div class="container" id="mainApp" style="display: none;">
    <header>
        <div class="logo-container"><img src="logo_aline.jpg" alt="Aline Silva Hair"></div>
        <h1>Aline Silva Hair</h1>
    </header>

    <div class="card">
        <div class="input-group"><label>Cliente</label><input type="text" id="clientName" placeholder="Nome"></div>
        <div class="input-group"><label>WhatsApp</label><input type="tel" id="clientPhone" placeholder="Digite o Número"></div>
        <div class="grid-2">
            <div class="input-group"><label>Hora</label><input type="time" id="appTime"></div>
            <div class="input-group"><label>Data</label><input type="date" id="appDate"></div>
        </div>
        <div class="input-group"><label>Procedimento</label><input type="text" id="appService" placeholder="Ex: Corte"></div>
        <button class="btn-add" onclick="addAppointment()">Agendar</button>
    </div>

    <div class="calendar-card">
        <div class="calendar-header">
            <span id="monthDisplay"></span>
            <div style="display: flex; gap: 20px;">
                <span onclick="changeMonth(-1)" style="cursor:pointer; padding: 5px;">&lt;</span>
                <span onclick="changeMonth(1)" style="cursor:pointer; padding: 5px;">&gt;</span>
            </div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="list-header" id="listDateTitle">Agendamentos</div>
    <div id="scheduleList"></div>
</div>

<div id="customModal" class="custom-modal">
    <div class="modal-content">
        <div id="modalTitle" class="modal-title">Aviso</div>
        <div id="modalText" class="modal-text">Mensagem...</div>
        <div class="modal-buttons">
            <button id="modalCancelBtn" class="modal-btn modal-btn-cancel">Cancelar</button>
            <button id="modalConfirmBtn" class="modal-btn modal-btn-confirm">OK</button>
        </div>
    </div>
</div>

<svg style="display: none;">
    <symbol id="icon-ws" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L0 24l6.335-1.662c1.72.937 3.659 1.432 5.628 1.433h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></symbol>
    <symbol id="icon-del" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></symbol>
</svg>

<script>
    let currentDate = new Date();
    let selectedDate = new Date().toISOString().split('T')[0];
    let appointments = JSON.parse(localStorage.getItem('aline_appointments')) || [];

    // VALIDAÇÃO DE SESSÃO DO LOGIN
    window.onload = function() {
        if(sessionStorage.getItem('aline_logged') === 'true') {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
        }
        document.getElementById('appDate').value = selectedDate;
        renderCalendar(); renderAppointments();
    };

    // FUNÇÃO AUXILIAR PARA GERAR O HASH SHA-256 DA SENHA
    async function sha256(str) {
        const buf = new TextEncoder().encode(str);
        const hash = await crypto.subtle.digest('SHA-256', buf);
        return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // VERIFICAÇÃO DA SENHA CODIFICADA
    async function checkLogin() {
        const pass = document.getElementById('loginPassword').value;
        const hashedPass = await sha256(pass);
        

        if(hashedPass === 'bd82cc586ed56e1b1c071447fea0e03d0c861792f26bedd2a5651fa8e26f6c2d') {
            sessionStorage.setItem('aline_logged', 'true');
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
        } else {
            customAlert("Senha incorreta! Tente novamente.");
        }
    }

    function addAppointment() {
        const name = document.getElementById('clientName').value;
        const phone = document.getElementById('clientPhone').value;
        const time = document.getElementById('appTime').value;
        const date = document.getElementById('appDate').value;
        const service = document.getElementById('appService').value;
        if(!name || !time || !date) return customAlert("Preencha Nome, Hora e Data.");
        appointments.push({id: Date.now(), name, phone: phone.replace(/\D/g, ''), time, date, service, status: 'pending'});
        localStorage.setItem('aline_appointments', JSON.stringify(appointments));
        selectedDate = date; renderCalendar(); renderAppointments();
        document.getElementById('clientName').value = ''; document.getElementById('clientPhone').value = ''; document.getElementById('appService').value = '';
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        const display = document.getElementById('monthDisplay');
        grid.innerHTML = '';
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const monthName = new Intl.DateTimeFormat('pt-BR', { month: 'long' }).format(currentDate);
        display.innerText = `${monthName.charAt(0).toUpperCase() + monthName.slice(1)} ${year}`;
        const dayNames = ['D','S','T','Q','Q','S','S'];
        dayNames.forEach(d => grid.innerHTML += `<div class="day-name">${d}</div>`);
        const firstDay = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();
        for(let i = 0; i < firstDay; i++) grid.innerHTML += `<div></div>`;
        for(let d = 1; d <= totalDays; d++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const hasApp = appointments.some(a => a.date === dateStr);
            grid.innerHTML += `<div class="day ${selectedDate === dateStr ? 'selected' : ''} ${hasApp ? 'has-app' : ''} ${new Date().toISOString().split('T')[0] === dateStr ? 'today' : ''}" onclick="selectDay('${dateStr}')">${d}</div>`;
        }
    }

    function selectDay(date) { selectedDate = date; renderCalendar(); renderAppointments(); }
    function changeMonth(step) { currentDate.setMonth(currentDate.getMonth() + step); renderCalendar(); }

    function renderAppointments() {
        const list = document.getElementById('scheduleList');
        list.innerHTML = '';
        const [y, m, d] = selectedDate.split('-');
        document.getElementById('listDateTitle').innerText = `Agenda: ${d}/${m}/${y}`;
        const filtered = appointments.filter(a => a.date === selectedDate).sort((a,b) => a.time.localeCompare(b.time));
        if(filtered.length === 0) { list.innerHTML = '<div class="empty-state">Sem horários agendados.</div>'; return; }
        filtered.forEach(a => {
            const isDone = a.status === 'done';
            list.innerHTML += `<div class="appointment-item" style="background: ${isDone ? '#f6ffed' : 'white'}; border-left-color: ${isDone ? '#52c41a' : '#c5a059'}">
                <div class="info">
                    <span class="time" style="color: ${isDone ? '#52c41a' : 'var(--gold)'}">${a.time}</span>
                    <h4 style="color: ${isDone ? '#237804' : 'var(--navy)'}">${a.name}</h4>
                    <p>${a.service || 'Corte'}</p>
                </div>
                <div class="actions">
                    <button class="btn-action btn-ws" onclick="sendWhatsApp(${a.id})"><svg class="icon-svg"><use xlink:href="#icon-ws"></use></svg></button>
                    <button class="btn-action btn-check ${isDone ? 'done' : ''}" onclick="toggleStatus(${a.id})"><svg class="icon-svg"><use xlink:href="#icon-check"></use></svg></button>
                    <button class="btn-action btn-del" onclick="deleteApp(${a.id})"><svg class="icon-svg"><use xlink:href="#icon-del"></use></svg></button>
                </div></div>`;
        });
    }

    function sendWhatsApp(id) {
        const a = appointments.find(x => x.id === id);
        const dataFmt = a.date.split('-').reverse().join('/');
        const e = (hex) => String.fromCodePoint(parseInt(hex, 16));
        let msg = "Olá, " + a.name + "! " + e("2728") + " Confirmando seu horário na *Aline Silva Hair*.\n\n";
        msg += e("1F5D3") + e("FE0F") + " *Data:* " + dataFmt + "\n";
        msg += e("23F0") + " *Hora:* " + a.time + "\n";
        msg += e("1F487") + " *Procedimento:* " + (a.service || 'Corte') + "\n\n";
        msg += e("26A0") + e("FE0F") + " _Em caso de não comparecimento, o valor da taxa de 50% não será devolvido._\n\n";
        msg += "Podemos confirmar? " + e("1F90E");
        window.location.href = "https://api.whatsapp.com/send?phone=55" + a.phone + "&text=" + encodeURIComponent(msg);
    }

    function toggleStatus(id) { appointments = appointments.map(a => a.id === id ? {...a, status: a.status === 'pending' ? 'done' : 'pending'} : a); save(); }
    function deleteApp(id) { 
        customConfirm("Deseja realmente apagar este agendamento?", function() {
            appointments = appointments.filter(a => a.id !== id); 
            save(); 
        });
    }
    function save() { localStorage.setItem('aline_appointments', JSON.stringify(appointments)); renderCalendar(); renderAppointments(); }

    // Funções para Controle das Caixas de Aviso Customizadas
    function customAlert(message) {
        document.getElementById('modalTitle').innerText = "Aviso";
        document.getElementById('modalText').innerText = message;
        const btnConfirm = document.getElementById('modalConfirmBtn');
        const btnCancel = document.getElementById('modalCancelBtn');
        btnCancel.style.display = 'none';
        btnConfirm.className = 'modal-btn modal-btn-confirm';
        btnConfirm.onclick = closeCustomModal;
        document.getElementById('customModal').classList.add('active');
    }

    function customConfirm(message, onConfirm) {
        document.getElementById('modalTitle').innerText = "Confirmação";
        document.getElementById('modalText').innerText = message;
        const btnConfirm = document.getElementById('modalConfirmBtn');
        const btnCancel = document.getElementById('modalCancelBtn');
        btnCancel.style.display = 'block';
        btnConfirm.className = 'modal-btn modal-btn-danger';
        btnConfirm.onclick = function() { onConfirm(); closeCustomModal(); };
        btnCancel.onclick = closeCustomModal;
        document.getElementById('customModal').classList.add('active');
    }

    function closeCustomModal() {
        document.getElementById('customModal').classList.remove('active');
    }

    // REGISTRO DO SERVICE WORKER PARA VIRAR APP
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(() => console.log('PWA Ativo!'));
    }
</script>

</body>
</html>
